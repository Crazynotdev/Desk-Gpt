appId: com.deskgpt.app
productName: DeskGPT
directories:
  buildResources: assets
  output: dist

files:
  - from: build
    to: app
  - from: dist/main
    to: .
  - from: package.json

win:
  target:
    - nsis
    - portable
  icon: assets/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true